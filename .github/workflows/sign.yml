name: 每日随机签到
on:
  schedule:
    - cron: '0 3 * * *' # UTC 3点 = 北京时间 11点，任务定时启动，脚本内部随机延时
  workflow_dispatch: # 支持手动点击测试

jobs:
  sign_task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装Python包
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      # 核心！自动安装chromium + 全部系统依赖，不再手动apt
      - name: 安装Playwright浏览器与系统依赖
        run: python -m playwright install chromium --with-deps

      - name: 执行签到脚本
        env:
          user_cookie: ${{ secrets.user_cookie }}
        run: python sign.py

      # 失败时上传截图作为工件，可以在Action页面下载图片
      - name: 上传错误截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
