name: 每日随机签到
on:
  schedule:
    - cron: '0 3 * * *' # UTC时间 3点 = 北京时间11点，任务定时启动，脚本内再随机延时
  workflow_dispatch: # 支持手动测试

jobs:
  sign_task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装系统依赖（Playwright浏览器依赖）
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxcb1 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2 libatspi2.0-0 libpulse0 libxss1 libasound2

      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: 执行签到脚本
        env:
          user_cookie: ${{ secrets.user_cookie }}
        run: python sign.py
