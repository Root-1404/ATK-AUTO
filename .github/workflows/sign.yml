name: ATK每日签到
on:
  schedule:
    - cron: '0 3 * * *' # UTC 3点 = 北京时间11点，定时拉起，脚本内部随机延时
  workflow_dispatch: # 支持手动点击测试

jobs:
  sign_task:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装Python包
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: 安装Playwright浏览器与系统依赖
        run: python -m playwright install chromium --with-deps

      - name: 执行签到脚本
        env:
          user_cookie: ${{ secrets.user_cookie }}
        run: python sign.py

      # 【优化】只有文件存在才上传截图，避免找不到文件的警告
      - name: 上传错误截图
        if: failure() && exists('error_screenshot.png')
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
