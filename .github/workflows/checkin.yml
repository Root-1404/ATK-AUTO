name: ATK Gear 每日签到
on:
  schedule:
    # UTC时间，下面是北京时间早8点（UTC 0点）执行，可自行修改
    - cron: '0 0 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖requests
        run: pip install requests

      - name: 执行签到脚本
        env:
          ATK_TOKEN: ${{ secrets.ATK_TOKEN }}
        run: python atk_check.py

      # 任务失败上传截图工件
      - name: 上传错误截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error_screenshot.png
