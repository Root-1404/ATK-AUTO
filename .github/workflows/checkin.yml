name: ATK Gear 每日签到
on:
  schedule:
    - cron: '0 23,0,1,2 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取脚本
        uses: actions/checkout@v4

      - name: 设置Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 定时任务才随机延时，手动触发跳过等待
        if: github.event_name == 'schedule'
        id: random_wait
        run: |
          python -c "import random; t=random.randint(0,14400); print(f'wait_seconds={t}') >> $GITHUB_OUTPUT"

      - name: 执行随机sleep（仅定时调度）
        if: github.event_name == 'schedule'
        run: sleep ${{ steps.random_wait.outputs.wait_seconds }}
        shell: bash

      - name: 安装python依赖
        run: |
          pip install requests pyjwt playwright

      - name: 安装playwright chromium系统依赖
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 运行签到脚本
        env:
          ATK_TOKEN: ${{ secrets.ATK_TOKEN }}
        run: python atk_check.py

      - name: 上传签到截图
        uses: actions/upload-artifact@v4
        with:
          name: atk-screenshot
          path: ./screenshots/*.png
