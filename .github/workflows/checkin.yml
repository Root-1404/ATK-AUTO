name: ATK Gear 每日签到
on:
  schedule:
    # UTC0点 = 北京时间早上8点
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取脚本
        uses: actions/checkout@v4

      - name: 设置Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装python依赖
        run: |
          pip install requests pyjwt playwright

      - name: 安装playwright chromium系统依赖
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 运行签到脚本
        env:
          ATK_TOKEN: ${{ secrets.ATK_TOKEN }}
        run: python atk_check.py

      # 可选：上传截图作为artifacts（可在Action页面下载截图）
      - name: 上传签到截图
        uses: actions/upload-artifact@v4
        with:
          name: atk-screenshot
          path: ./screenshots/*.png
